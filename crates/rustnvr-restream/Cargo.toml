[package]
name = "rustnvr-restream"
description = "RustNVR RTSP republication: serves the frames already received from the cameras to other RTSP clients, without re-encoding"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
futures.workspace = true
getrandom = "0.4"
md-5 = "0.11"
rustnvr-core.workspace = true
rustnvr-stream.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "macros", "rt"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
rustnvr-testkit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process"] }

[lints]
workspace = true
